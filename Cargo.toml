[package]
name = "hexyl"
version = "0.16.0"
edition = "2021"
authors = ["David Peter <mail@david-peter.de>"]
description = "A command-line hex viewer"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "=4.5.37", features = ["derive", "env"] }
clap_complete = "=4.5.47"
terminal_size = "0.4"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
