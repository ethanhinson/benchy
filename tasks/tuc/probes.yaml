- name: help
  argv: ["--help"]
  normalize: help
- name: version
  argv: ["--version"]
  normalize: help
- name: field-2
  argv: ["-d", ":", "-f", "2"]
  stdin: "a:b:c\n"
- name: field-1
  argv: ["-d", "-", "-f", "1"]
  stdin: "a-b-c-d\n"
- name: field-range
  argv: ["-d", "-", "-f", "1:3"]
  stdin: "a-b-c-d\n"
- name: last-field
  argv: ["-d", ",", "-f", "-1"]
  stdin: "one,two,three\n"
- name: json-fields
  argv: ["-d", ":", "--json"]
  stdin: "x:y:z\n"
